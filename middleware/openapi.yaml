openapi: 3.0.3
info:
  title: Northstar AP/AR Integration Platform API
  version: 1.0.0
  description: |
    Learning project. All data is synthetic. Amounts are decimal strings ("1250.00") with an explicit ISO 4217 currency.
    Every response carries an X-Correlation-Id header; quote it when reporting problems.
    POST endpoints that change financial state require an Idempotency-Key header.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: health
  - name: master-data
  - name: audit
  - name: integration
  - name: ap
paths:
  /health:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      responses:
        '200': { description: Process is running }
  /ready:
    get:
      tags: [health]
      security: []
      summary: Readiness probe (database and NetSuite reachable)
      responses:
        '200': { description: Ready }
        '503': { description: A dependency is unavailable }
  /api/v1/vendors:
    get:
      tags: [master-data]
      summary: List vendors from NetSuite (bank tokens are never returned)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { items: { type: array, items: { $ref: '#/components/schemas/Vendor' } } },
                }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/vendors/{externalId}:
    get:
      tags: [master-data]
      summary: Get one vendor by external ID
      parameters: [{ $ref: '#/components/parameters/ExternalId' }]
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } },
          }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/customers:
    get:
      tags: [master-data]
      summary: List customers
      responses:
        '200': { description: OK }
  /api/v1/customers/{externalId}:
    get:
      tags: [master-data]
      summary: Get one customer
      parameters: [{ $ref: '#/components/parameters/ExternalId' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/bills/open:
    get:
      tags: [master-data]
      summary: Open vendor bills (amount remaining > 0)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { items: { type: array, items: { $ref: '#/components/schemas/VendorBill' } } },
                }
  /api/v1/invoices/open:
    get:
      tags: [master-data]
      summary: Open customer invoices
      parameters:
        - { name: customer, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/audit:
    get:
      tags: [audit]
      summary: Audit events for an entity or a correlation ID
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/sync/vendors:
    post:
      tags: [integration]
      summary: Upsert vendors from the upstream system into NetSuite (role ops)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [vendor_code, legal_name, ccy, status, pay_method, bank_ref]
                    properties:
                      vendor_code: { type: string }
                      legal_name: { type: string }
                      ccy: { type: string }
                      status: { type: string, enum: [ACTIVE, INACTIVE] }
                      pay_method: { type: string, enum: [ACH, WIRE, VCARD] }
                      bank_ref:
                        { type: string, description: 'Vault token (tok_...), never a raw account number' }
                      routing_number: { type: string }
      responses:
        '200':
          {
            description: Sync report,
            content: { application/json: { schema: { $ref: '#/components/schemas/SyncReport' } } },
          }
  /api/v1/sync/customers:
    post:
      tags: [integration]
      summary: Upsert customers into NetSuite (role ops)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          {
            description: Sync report,
            content: { application/json: { schema: { $ref: '#/components/schemas/SyncReport' } } },
          }
  /api/v1/jobs/{id}:
    get:
      tags: [integration]
      summary: Integration job details (status, attempts, error, correlation ID)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /api/v1/dead-letters:
    get:
      tags: [integration]
      summary: List dead letters
      parameters: [{ name: status, in: query, schema: { type: string, enum: [OPEN, REPLAYED, DISCARDED] } }]
      responses:
        '200': { description: OK }
  /api/v1/dead-letters/{id}/replay:
    post:
      tags: [integration]
      summary: Re-run a dead letter with its original payload and correlation ID
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Replay result (job status SUCCEEDED or FAILED) }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/dead-letters/{id}/discard:
    post:
      tags: [integration]
      summary: Close a dead letter without re-running it (reason required)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [reason],
                    properties: { reason: { type: string, minLength: 5 } },
                  },
              },
          }
      responses:
        '200': { description: OK }
  /api/v1/ap/proposal:
    get:
      tags: [ap]
      summary: Eligible bills grouped per vendor, plus every excluded bill with its reasons
      parameters:
        - { name: currency, in: query, required: true, schema: { type: string } }
        - { name: rail, in: query, required: true, schema: { type: string, enum: [ACH, WIRE, VCARD] } }
        - { name: windowDays, in: query, schema: { type: integer, default: 7 } }
      responses:
        '200': { description: Proposal }
  /api/v1/payment-batches:
    get:
      tags: [ap]
      summary: List payment batches
      parameters: [{ name: status, in: query, schema: { type: string } }]
      responses:
        '200': { description: OK }
    post:
      tags: [ap]
      summary: Create a payment batch (role ap_maker). Eligibility is recomputed on the server.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [currency, rail]
              properties:
                currency: { type: string }
                rail: { type: string, enum: [ACH, WIRE, VCARD] }
                windowDays: { type: integer }
                billExternalIds: { type: array, items: { type: string } }
      responses:
        '201': { description: Batch PENDING_APPROVAL with instructions }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/payment-batches/{id}:
    get:
      tags: [ap]
      summary: Batch with its instructions
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /api/v1/payment-batches/{id}/approve:
    post:
      tags: [ap]
      summary: Approve (role ap_checker; must not be the maker)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: APPROVED }
        '403': { description: MAKER_CHECKER_VIOLATION }
        '422': { description: BILL_NOT_ELIGIBLE }
  /api/v1/payment-batches/{id}/reject:
    post:
      tags: [ap]
      summary: Reject with a reason (role ap_checker)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: REJECTED }
  /api/v1/payment-batches/{id}/submit:
    post:
      tags: [ap]
      summary: Flag bills, build the payment file, archive it and send it to the bank SFTP
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: SUBMITTED }
        '409': { description: BATCH_MODIFIED_AFTER_APPROVAL or illegal state }
  /api/v1/bank/inbound/poll:
    post:
      tags: [ap]
      summary: Process files in the bank SFTP inbound folder (ACK, PAYMENT_STATUS, statements)
      responses:
        '200': { description: One result per file (PROCESSED, DUPLICATE, QUARANTINED, RETRY_LATER) }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ExternalId:
      name: externalId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SyncReport:
      type: object
      properties:
        received: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        invalid: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              sourceRef: { type: string }
              outcome: { type: string, enum: [CREATED, UPDATED, FAILED, INVALID] }
              internalId: { type: string }
              jobId: { type: string }
              error: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+(\.\d+)?$', example: '1250.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: USD }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            details: {}
            correlationId: { type: string }
    Vendor:
      type: object
      properties:
        externalId: { type: string }
        internalId: { type: string }
        companyName: { type: string }
        currency: { type: string }
        isInactive: { type: boolean }
        paymentRail: { type: string, enum: [ACH, WIRE, VCARD] }
    VendorBill:
      type: object
      properties:
        externalId: { type: string }
        vendorExternalId: { type: string }
        tranId: { type: string }
        tranDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string }
        total: { type: string }
        amountRemaining: { type: string }
        approvalStatus: { type: string, enum: [APPROVED, PENDING, REJECTED] }
        onHold: { type: boolean }
        paymentInProgress: { type: boolean }
