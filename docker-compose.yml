# Local development stack.
#   docker compose up -d db          → only PostgreSQL (run the app with `npm run dev`)
#   docker compose up --build        → PostgreSQL + middleware container
# All credentials here are LOCAL-ONLY placeholders.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      # Override the host port if 5432 is taken: DB_PORT=15432 docker compose up -d db
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U northstar']
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  middleware:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.example
    environment:
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://northstar:northstar@db:5432/northstar
      NODE_ENV: development
    # Apply database migrations first, then start the server. In the cloud the same migrate command
    # runs as a separate one-off task before the new version receives traffic (see deployment.md).
    command:
      [
        'sh',
        '-c',
        'node dist/middleware/src/infrastructure/db/migrate.js && node dist/middleware/src/server.js',
      ]
    ports:
      # Override the host port if 3000 is taken: MW_PORT=4000 docker compose --profile app up --build
      - '127.0.0.1:${MW_PORT:-3000}:3000'
    profiles: ['app']

volumes:
  pgdata:
