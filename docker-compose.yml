# Local development stack.
#   docker compose up -d db          → only PostgreSQL (run the app with `npm run dev`)
#   docker compose up --build        → PostgreSQL + middleware container
# All credentials here are LOCAL-ONLY placeholders.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U northstar']
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  middleware:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.example
    environment:
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://northstar:northstar@db:5432/northstar
      NODE_ENV: development
    ports:
      - '127.0.0.1:3000:3000'
    profiles: ['app']

volumes:
  pgdata:
